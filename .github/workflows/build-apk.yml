name: Build Waguri Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Waguri APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Assets
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: frontend
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p apk-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk apk-output/Waguri.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waguri-APK
          path: apk-output/Waguri.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3-apk
          name: "Waguri AI Companion Android App v1.0.3"
          body: |
            ### 🌸 Waguri AI Persona-Twin Android APK
            
            Welcome to the official Android build for **Waguri AI Companion**!
            
            #### 📱 Direct Download:
            Click below to download the `.apk` directly to your phone:
            - **[Download Waguri.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.3-apk/Waguri.apk)**
            
            #### 🚀 How to Install on Android:
            1. Tap the **Download Waguri.apk** link above on your phone.
            2. When downloaded, open the `.apk` file from your notification bar or Downloads folder.
            3. Tap **Install** (if prompted, toggle **Allow from this source**).
            4. Launch Waguri to chat with your real-time 3D VRM Anime companion!
          files: apk-output/Waguri.apk
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
